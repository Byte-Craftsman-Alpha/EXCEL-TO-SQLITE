<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ title or "SQL Explorer" }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/3/3.1.1/iconify.min.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
  </head>
  <body class="min-h-screen bg-gradient-to-br from-slate-50 to-slate-100 text-slate-800">
    <div class="sx-app">
      <header class="sx-app-header">
        <div class="w-full px-6 md:px-8 py-5">
          <div class="flex items-start justify-between gap-6">
            <div>
              <div class="text-xs uppercase tracking-[0.2em] text-slate-500">SQL Explorer</div>
              <h1 class="text-2xl font-semibold text-slate-900">Excel to SQLite Query UI</h1>
              <p class="text-sm text-slate-500 mt-1">Upload an Excel workbook and run SQL against its sheets.</p>
            </div>
            <div class="hidden md:flex items-center gap-2">
              <div class="minimal-badge">Tailwind</div>
              <div class="minimal-badge">Flask</div>
              <div class="minimal-badge">SQLite</div>
            </div>
          </div>
        </div>
      </header>

      <main class="sx-app-main">
        <div class="w-full px-6 md:px-8 pb-6 md:pb-8 h-full">
          {% block content %}{% endblock %}
        </div>
      </main>
    </div>

    <div id="sx-loader" class="sx-loader hidden" aria-hidden="true">
      <div class="sx-loader-card">
        <div class="sx-spinner" aria-hidden="true"></div>
        <div>
          <div class="text-sm font-semibold text-slate-900">Working…</div>
          <div class="text-xs text-slate-500">Loading data and rendering results</div>
        </div>
      </div>
    </div>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
  </body>
</html>
